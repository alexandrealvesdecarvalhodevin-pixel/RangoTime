name: Lembretes por e-mail

on:
  schedule:
    # 21:00 UTC = 18:00 em Brasília, todos os dias
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dia:
        description: "Simular um dia da semana (0=domingo ... 6=sábado). Vazio = hoje."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar lembrete
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DIA: ${{ inputs.dia }}
        run: python .github/scripts/lembrete.py
